<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 14 - CSS para Formulários</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main>
        <h2>Formulário de Cadastro</h2>

          <form>
         <label for="nome">Nome:</label>
         <input type="text" id="nome" required disabled>

         <label for="email">E-mail:</label>
        <input type="email" id="email" required disabled>

          <label for="telefone">Telefone:</label>
         <input type="tel" id="telefone" required disabled>

         <label for="cidade">Cidade:</label>
           <input type="text" id="cidade" required disabled>
 
            <button type="button" id="habilitar">Habilitar campos</button>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
