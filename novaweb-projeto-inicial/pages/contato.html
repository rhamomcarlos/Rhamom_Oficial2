<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - TechStore</title>

    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <header>
        <h1>TechStore</h1>

        <nav>
            <a href="../TechStore/index.html">Início</a>
            <a href="produtos.html">Produtos</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Entre em Contato</h2>

            <p>Preencha o formulário abaixo para falar conosco.</p>

            <form>

                <label for="nome">Nome:</label><br>
                <input type="text" id="nome" name="nome"><br><br>

                <label for="email">E-mail:</label><br>
                <input type="email" id="email" name="email"><br><br>

                <label for="assunto">Assunto:</label><br>
                <input type="text" id="assunto" name="assunto"><br><br>

                <label for="mensagem">Mensagem:</label><br>
                <textarea id="mensagem" name="mensagem" rows="5"></textarea><br><br>

                <button type="submit">Enviar mensagem</button>

            </form>

        </section>

    </main>

    <footer>
        <p>© 2026 TechStore - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
