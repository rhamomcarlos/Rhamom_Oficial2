<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagína de Perfil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <h1>Bem-Vindo ao Perfil</h1>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </header>

    <form>
       <div class="alert alert-info" id="mensagem" style="display:none;">
        <p>Pra que jogar a Bola Na Mavie POH!!</p>
        <p>ARROGANTHIIIII!!</p>
        
         </div>
         
        <div>
        <img src="fotos/Neymar.jpg" alt="Menino Ney" width="150" height="150"
        onmouseover="console.log('Mouse sobre a imagem!');"> ==€ 180 milhões
        </div>
        <div class="form-group">
               <label for="Nome" class="form-label">Nome:</label>
            <input type="text" class="form-control" id="nome" name="nome" value="Seu Nome">
        
            </div>

             <div>
                  <label for="SEXO" class="form-label">SEXO:</label>
            <input type="radio" id="masculino" name="sexo" value="Masculino" required>
           <label for="masculino">Masculino</label>
             
        
           <input type="radio" id="feminino" name="sexo" value="Feminino">
          <label for="feminino">Feminino</label>
             </div>


                  <div class="form-group">
               <label for="CPF" class="form-label">CPF:</label>
            <input type="text" class="form-control" id="CPF" name="CPF" value="Seu CPF" placeholder="Seu CPF" onblur="validaCPF()">
        
            </div>

        <div class="form-group">
            <label for="Nascimento" class="form-label">Data de Nascimento:</label>
            <input type="date" class="form-control" id="nascimento" name="nascimento" value="0000-00-00" max="2026-10-09" required>
            </div>

                 
         <div>
             <label for="Interesses" class="form-label">Interesses:</label>
         </div>
         <div>
       <input type="checkbox" id="jogos" name="interesses" value="Jogos">
        <label for="jogos">Jogos</label>
        </div>
           
        <div>
          <input type="checkbox" id="esporte" name="interesses" value="Esporte">
          <label for="esporte">Esportes</label>
        </div>

            <div>
                <input type="checkbox" id="musica" name="interesses" value="Música">
               <label for="musica">Música</label>
            </div>
                 

               <div>
               <input type="checkbox" id="Outros" name="Outros" value="Outros">
             <label for="Outros">Outros</label>
             </div>
            

             <div class="form-group">
    <label for="campeonato" class="form-label">Campeonato favorito:</label>

    <select class="form-control" id="campeonato" name="campeonato" required>
        <option value="">Selecione um campeonato</option>
        <option value="Brasileirão">Brasileirão</option>
        <option value="Champions League">Champions League</option>
        <option value="Copa do Mundo">Copa do Mundo</option>
        <option value="Paulista">Paulista</option>
    </select>
</div>




  <div class="form-group">
    <label for="sobre" class="form-label">O que você acha do Neymar?</label>

    <textarea class="form-control" id="sobre" name="sobre"
        rows="4" placeholder="Escreva sua opinião aqui..." required></textarea>
   </div>




    <div class="form-group">
    <button type="button" class="btn btn-primary" onclick="mensagem()">Salvar</button>
    <button type="reset" class="btn btn-secondary" onclick="limparMensagem()">Limpar</button>
    </div>

    </form>
    <main>
 
    </main>

</body>
</html>
